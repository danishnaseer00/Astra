<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src 'self'; script-src 'none'">
<title>new tab</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #0b0c0e;
    font-family: Inter, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mark {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #8ab0ff, #3f6fd8 70%);
    box-shadow: 0 0 0 1px rgba(122, 162, 247, 0.25), 0 8px 24px rgba(63, 111, 216, 0.25);
  }
  h1 {
    margin: 0;
    font: 500 30px/1.2 Fredoka, 'Segoe UI', sans-serif;
    letter-spacing: 0.3px;
    color: #e8eaf0;
  }
  p {
    margin: 0;
    font-size: 13px;
    color: #565d6b;
  }
</style>
</head>
<body>
  <div class="mark"></div>
  <h1>agentic browser</h1>
  <p>Ask the agent a task in the panel on the right — or search from the omnibox.</p>

</html>
