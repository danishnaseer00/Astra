<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>form test</title>
</head>
<body>
<h1>Form wizardry test</h1>
<form id="f">
  <p><label>Name <input type="text" name="name" placeholder="Full name"></label></p>
  <p><label>Email <input type="email" name="email" placeholder="you@example.com"></label></p>
  <p><label>Birth date <input type="date" name="birth"></label></p>
  <p><label>Favorite color <input type="color" name="color" value="#000000"></label></p>
  <p><label>Country
    <select name="country">
      <option value="">— choose —</option>
      <option value="us">United States</option>
      <option value="de">Germany</option>
      <option value="jp">Japan</option>
    </select>
  </label></p>
  <p><label>Hobbies
    <select name="hobbies" multiple size="3">
      <option value="read">Reading</option>
      <option value="code">Coding</option>
      <option value="hike">Hiking</option>
    </select>
  </label></p>
  <p><label><input type="checkbox" name="news"> Subscribe to newsletter</label></p>
  <p>
    <label><input type="radio" name="tier" value="free"> Free</label>
    <label><input type="radio" name="tier" value="pro"> Pro</label>
  </p>
  <p><label>Resume <input type="file" name="resume"></label></p>
  <p><button type="button" id="submit">Submit form</button></p>
</form>
<pre id="out"></pre>
<script>
document.getElementById('submit').addEventListener('click', () => {
  const f = document.getElementById('f')
  const file = f.resume.files[0]
  const out = {
    name: f.name.value,
    email: f.email.value,
    birth: f.birth.value,
    color: f.color.value,
    country: f.country.value,
    hobbies: [...f.hobbies.selectedOptions].map((o) => o.value),
    news: f.news.checked,
    tier: document.querySelector('input[name="tier"]:checked')?.value ?? 'none',
    file: file ? `${file.name} (${file.size} bytes)` : 'none',
  }
  document.getElementById('out').textContent = JSON.stringify(out, null, 2)
})
</script>
</body>
</html>
